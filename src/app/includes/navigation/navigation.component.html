<div class="container">
    <nav class="navbar">
        <ul>
            <li class="nav-item">
                <a class="nav-link" routerLink="/">Accueil</a>
            </li>

            @if (isAuthenticated$ | async) {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/dashboard">
                        Gestion des étudiants
                    </a>
                </li>
                <li class="nav-item">
                    <button class="nav-link"  type="button" (click)="logout()">
                        Déconnexion
                    </button>
                </li>
            } @else {
                <li class="nav-item">
                    <a class="nav-link" routerLink="/login">
                        Connexion
                    </a>
                </li>
                }
        </ul>
    </nav>
</div>
